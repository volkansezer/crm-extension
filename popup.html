<html>
	<head>
		<meta charset="UTF-8" />
		<title>Servis CRM</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<style>
			body, html{
				margin: 0px;
			}

			body{
				min-width: 400px;
				background: url(assets/img/form-bg.jpeg)no-repeat bottom center fixed;
				-webkit-background-size: cover;
				-moz-background-size: cover;
				-o-background-size: cover;
				background-size: cover;
				background-repeat: no-repeat;
				-ms-flex-align: center;
				-ms-flex-pack: center;
				-webkit-box-align: center;
				align-items: center;
				-webkit-box-pack: center;
				justify-content: center;
			}

			hr.myHr{
				margin: 0px auto;
			}
			#spanDurum{
				font-size: smaller;
				color:dimgrey;
			}
		</style>
		<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	<body>
		<div class="container">
			<h3>Servis CRM</h3>
			<button type="button" id="refreshBtn" class="btn btn-success">YENİLE</button>
			<hr class="myHr">
			<span id="spanDurum">> Hoşgeldiniz...</span>
			<hr class="myHr">
						
			<div id="divMain"></div>

			<div id="divForm" style="display: none;">
				<form>
					<p id="result"></p>
					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<input type="tel" name="merkezno" id="merkezno" class="form-control form-control-sm" placeholder="Merkez no..." required maxlength="10" pattern="[0-9]{10}" title="GSPN No 10 rakamdan oluşuyor...">
						</div>
						<input type="text" name="ziyaret" id="ziyaret" class="form-control form-control-sm" placeholder="Ziyaret tarihi..." required>
					</div>

					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<input type="text" name="adi" id="adi" class="form-control form-control-sm" placeholder="Adı..." required>
						</div>
						<input type="text" name="soyadi" id="soyadi" class="form-control form-control-sm" placeholder="Soyadı..." required>
					</div>

					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<input type="text" name="tel1" id="tel1" class="form-control form-control-sm" placeholder="Telefon 1..." required maxlength="11" pattern="[0-9]{11}" title="0 ile başlayıp en az 11 karakter olmalı...">
						</div>
						<input type="text" name="tel2" id="tel2" class="form-control form-control-sm" placeholder="Telefon 2..." maxlength="11" pattern="{0}|[0-9]{11}" title="Ya boş olmalı ya da 0 ile başlayıp en az 11 karakter olmalı...">
					</div>

					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<select name="ilce" id="ilce" class="form-control form-control-sm" required>
								<option value="" disabled selected>----</option>
							</select>	
						</div>
						<select name="mahalle" id="mahalle" class="form-control form-control-sm" required>
							<option value="" disabled selected>--ÖNCE İLÇE SEÇİN--</option>
						</select>
					</div>

					<div class="input-group mb-3">
						<input type="text" name="adres" id="adres" class="form-control form-control-sm" placeholder="Adres..." required>
					</div>

					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<select name="randevu" id="randevu" class="form-control form-control-sm" required>
								<option value="" disabled selected>--İşlem--</option>
								<option value="1">Kurulum</option>
								<option value="2">Arıza</option>
							</select>
						</div>
						<select name="urungam" id="urungam" class="form-control form-control-sm" required>
							<option value="" disabled selected>--Ürün Gam--</option>
						</select>
					</div>

					<div class="input-group mb-3">
						<div class="input-group-prepend">
							<input type="text" name="model" id="model" class="form-control form-control-sm" placeholder="Model..." required>
						</div>
						<input type="text" name="seri" id="seri" class="form-control form-control-sm" placeholder="Seri...">
					</div>

					<div class="input-group mb-3">
						<input type="text" name="talep" id="talep" class="form-control form-control-sm" placeholder="Talep...">
					</div>

					<div class="input-group mb-3">
						<input type="text" name="eknot" id="eknot" class="form-control form-control-sm" placeholder="Eknot...">
					</div>
					
					<button type="submit" class="btn btn-primary">KAYDET</button>					

				</form>
			</div>

			
		</div>
	</body>
	<script src='assets/js/jquery-3.7.1.min.js'></script>
	<script src='assets/js/jquery-ui.js'></script>
	<script src='popup.js'></script>
</html>
